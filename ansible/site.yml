---
# Main playbook: configure the Jenkins controller VM provisioned by Terraform.
#
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook site.yml -e jenkins_admin_password='<secret>'
#
- name: Configure Jenkins controller on GCP
  hosts: jenkins
  become: true
  gather_facts: true

  pre_tasks:
    - name: Wait for the host to be reachable
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

    - name: Assert an admin password was supplied
      ansible.builtin.assert:
        that:
          - jenkins_admin_password | length > 0
        fail_msg: "Pass -e jenkins_admin_password=... (or set JENKINS_ADMIN_PASSWORD)."

  roles:
    - role: common
      tags: [common]
    - role: docker
      tags: [docker]
    - role: gcp_tools
      tags: [gcp_tools]
    - role: jenkins
      tags: [jenkins]
    - role: monitoring
      tags: [monitoring]
