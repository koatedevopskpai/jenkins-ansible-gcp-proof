---
# Shared variables for the Jenkins controller configuration.

# --- Base host ---
timezone: Europe/London
enable_ufw: false
ufw_allowed:
  - OpenSSH
  - "8080/tcp"
  - "50000/tcp"

# --- Jenkins ---
jenkins_admin_user: admin
# Set via extra-vars or the JENKINS_ADMIN_PASSWORD env var at run time:
#   ansible-playbook site.yml -e jenkins_admin_password=...
# (Left empty so it fails fast rather than shipping a default password.)
jenkins_admin_password: ""
jenkins_port: 8080
jenkins_java_package: openjdk-17-jre-headless
jenkins_plugins:
  - configuration-as-code
  - git
  - workflow-aggregator
  - workflow-cps-global-lib
  - github
  - docker-workflow
  - pipeline-utility-steps
  - credentials-binding
  - google-oauth-plugin
  - google-kubernetes-engine
  - ws-cleanup
  - timestamper
  - ansicolor

# Shared pipeline library (this repo's jenkins/shared-library directory).
jenkins_shared_library_name: platform-lib
jenkins_shared_library_repo: "https://github.com/koatedevopskpai/jenkins-ansible-gcp-proof.git"

# --- GCP / deployment ---
gcp_project_id: ""
gcp_region: us-central1
demo_artifact_repository: jenkins-demo

# --- Observability ---
install_ops_agent: true
